<style>
    body {

    /* BUTTON BAR (COPIED FROM FIRST HTML) */
    #button-container {
        text-align: center;
        margin: 20px 0;
    }

    .big-button {
        display: inline-block;
        background-color: rgba(248, 203, 70, 1);
        color: rgba(0, 0, 70, 1);
        font-size: 12pt;
        font-weight: bold;
        padding: 8px 16px;
        margin: 6px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: 'Abel', sans-serif;
        transition: background-color 0.3s, color 0.3s;
    }

    .big-button:hover {
        background-color: rgba(248, 203, 70, 1);
        color: rgba(0, 0, 70, 1);
    }

    #textbox {
        width: 1024px;
        margin: 0 auto;
        background: rgba(248, 203, 70, 1);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
    }

    figure {
        margin: 24px;
        width: 200px;
        text-align: center;
        word-wrap: break-word;
    }

    img, .zoom {
        width: 200px;
        height: 200px;
        border: 1px solid gray;
        box-shadow: 2px 3px 6px gray;
        transition: transform 0.5s;
    }

    figcaption {
        font: 12pt/1.4em 'Abel';
        margin-top: 3px;
        color: rgba(0, 0, 70, 1);
    }

    img:hover {
        transform: scale(1.03);
        transition: transform 0.5s;
    }

    .zoom:hover {
        background-size: 105%;
        transition: background-size 0.5s;
    }

    /* Bold/Reset Buttons */
    #controls {
        text-align: center;
        margin: 24px auto 40px auto;
    }

    #controls span {
        display: inline-block;
        background-color: rgba(248, 203, 70, 1);
        color: rgba(0, 0, 70, 1);
        padding: 12px 24px;
        margin: 0 12px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        font-family: 'Abel', sans-serif;
        transition: background-color 0.3s;
    }

    #controls span:hover {
        background-color: rgba(248, 203, 70, 1);
        color: rgba(0, 0, 70, 1);
    }
</style>

    <div id="controls">
        <span onclick="makeBold()">Bold Words</span>
        <span onclick="resetBold()">Reset Words</span>
    </div>

    <script>
        function makeBold() {
            const captions = document.querySelectorAll('figcaption');
            captions.forEach(caption => caption.style.fontWeight = 'bold');
        }

        function resetBold() {
            const captions = document.querySelectorAll('figcaption');
            captions.forEach(caption => caption.style.fontWeight = 'normal');
        }
    </script>
